version: '3.8'

# Interview App 应用服务编排
# 只包含应用容器，遵循单一职责原则
# 基础设施服务（MySQL、Redis、MongoDB、MinIO）需要单独部署

services:
  # ==================== 应用服务 ====================
  
  # Web MVC 模块
  interview-app-mvc:
    build:
      context: .
      dockerfile: interview-app-mvc/Dockerfile
    container_name: interview-app-mvc
    ports:
      - "8081:8081"
    environment:
      # 构建环境
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Asia/Shanghai
      
      # 数据库配置（需要外部提供）
      - MYSQL_JDBC_URL=${MYSQL_JDBC_URL:-jdbc:mysql://localhost:3306/interview}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-minglg}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-kfzx-minglg@}
      
      # Redis 配置（需要外部提供）
      - REDIS_NODE_1=${REDIS_NODE_1:-localhost:6379}
      - REDIS_NODE_2=${REDIS_NODE_2:-localhost:6380}
      - REDIS_NODE_3=${REDIS_NODE_3:-localhost:6381}
      - REDIS_NODE_4=${REDIS_NODE_4:-localhost:6382}
      - REDIS_NODE_5=${REDIS_NODE_5:-localhost:6383}
      - REDIS_NODE_6=${REDIS_NODE_6:-localhost:6384}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-kfzx-minglg@}
      
      # MongoDB 配置（需要外部提供）
      - MONGODB_HOST=${MONGODB_HOST:-localhost}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_USERNAME=${MONGODB_USERNAME:-minglg}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-kfzx-minglg@}
      
      # MinIO 配置（需要外部提供）
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      
      # AI 服务配置（需要外部提供）
      - ALIYUN_API_KEY=${ALIYUN_API_KEY:-your-api-key}
      
      # JWT 配置（需要外部提供）
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 实时通信模块（未来扩展）
  interview-app-realtime:
    build:
      context: .
      dockerfile: interview-app-realtime/Dockerfile
    container_name: interview-app-realtime
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Asia/Shanghai
      - REDIS_NODE_1=${REDIS_NODE_1:-localhost:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-kfzx-minglg@}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - realtime
      - full

  # 管理后台模块（未来扩展）
  interview-app-admin:
    build:
      context: .
      dockerfile: interview-app-admin/Dockerfile
    container_name: interview-app-admin
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Asia/Shanghai
      - MYSQL_JDBC_URL=${MYSQL_JDBC_URL:-jdbc:mysql://localhost:3306/interview}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-minglg}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-kfzx-minglg@}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - admin
      - full

  # API 网关模块（未来扩展）
  interview-app-api:
    build:
      context: .
      dockerfile: interview-app-api/Dockerfile
    container_name: interview-app-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/app/logs
    depends_on:
      - interview-app-mvc
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - api
      - full

# 网络配置
networks:
  app-network:
    external: true