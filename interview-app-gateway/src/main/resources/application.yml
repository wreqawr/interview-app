server:
  port: 10000
spring:
  application:
    name: interview-app-gateway
  # nacos配置中心
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        namespace: public
        group: dev

    gateway:
      server:
        webflux:
          routes:
            - id: interview-app-user
              uri: lb://interview-app-webmvc
              predicates:
                - Path=/api/auth/**


