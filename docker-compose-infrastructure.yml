version: '3.8'

# Interview App 基础设施服务
# 包含数据库、缓存、存储等服务
# 可选使用，也可以使用外部服务

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: interview-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=interview
      - MYSQL_USER=minglg
      - MYSQL_PASSWORD=kfzx-minglg@
      - TZ=Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - infrastructure-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis 集群
  redis-1:
    image: redis:7-alpine
    container_name: interview-redis-1
    ports:
      - "6379:6379"
    volumes:
      - redis_1_data:/data
    restart: unless-stopped
    networks:
      - infrastructure-network
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-2:
    image: redis:7-alpine
    container_name: interview-redis-2
    ports:
      - "6380:6379"
    volumes:
      - redis_2_data:/data
    restart: unless-stopped
    networks:
      - infrastructure-network
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-3:
    image: redis:7-alpine
    container_name: interview-redis-3
    ports:
      - "6381:6379"
    volumes:
      - redis_3_data:/data
    restart: unless-stopped
    networks:
      - infrastructure-network
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-4:
    image: redis:7-alpine
    container_name: interview-redis-4
    ports:
      - "6382:6379"
    volumes:
      - redis_4_data:/data
    restart: unless-stopped
    networks:
      - infrastructure-network
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-5:
    image: redis:7-alpine
    container_name: interview-redis-5
    ports:
      - "6383:6379"
    volumes:
      - redis_5_data:/data
    restart: unless-stopped
    networks:
      - infrastructure-network
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-6:
    image: redis:7-alpine
    container_name: interview-redis-6
    ports:
      - "6384:6379"
    volumes:
      - redis_6_data:/data
    restart: unless-stopped
    networks:
      - infrastructure-network
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis 集群初始化
  redis-cluster-init:
    image: redis:7-alpine
    container_name: interview-redis-cluster-init
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6
    networks:
      - infrastructure-network
    command: >
      sh -c "
        echo '等待 Redis 节点启动...'
        sleep 10
        echo '创建 Redis 集群...'
        echo 'yes' | redis-cli --cluster create 
          redis-1:6379 redis-2:6379 redis-3:6379 
          redis-4:6379 redis-5:6379 redis-6:6379 
          --cluster-replicas 1
        echo 'Redis 集群创建完成'
      "
    profiles:
      - init

  # MongoDB
  mongodb:
    image: mongo:6.0
    container_name: interview-mongodb
    environment:
      - MONGO_INITDB_DATABASE=interview
      - MONGO_INITDB_ROOT_USERNAME=minglg
      - MONGO_INITDB_ROOT_PASSWORD=kfzx-minglg@
      - TZ=Asia/Shanghai
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - infrastructure-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: interview-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - TZ=Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - infrastructure-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

# 数据卷
volumes:
  mysql_data:
    driver: local
  redis_1_data:
    driver: local
  redis_2_data:
    driver: local
  redis_3_data:
    driver: local
  redis_4_data:
    driver: local
  redis_5_data:
    driver: local
  redis_6_data:
    driver: local
  mongodb_data:
    driver: local
  minio_data:
    driver: local

# 网络配置
networks:
  infrastructure-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16 