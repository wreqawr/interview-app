networks:
  interview-net:
    external: true
services:
  interview-app-mvc:
    image: interview-app-mvc:latest
    container_name: interview-app-mvc
    networks:
      - interview-net
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      # 数据库配置
      - MYSQL_JDBC_URL=jdbc:mysql://mysql-8:3306/interview
      - MYSQL_USERNAME=minglg
      - MYSQL_PASSWORD=kfzx-minglg@
      # Redis配置
      - REDIS_NODE_1=redis-1:6379
      - REDIS_NODE_2=redis-2:6379
      - REDIS_NODE_3=redis-3:6379
      - REDIS_NODE_4=redis-4:6379
      - REDIS_NODE_5=redis-5:6379
      - REDIS_NODE_6=redis-6:6379
      - REDIS_PASSWORD=kfzx-minglg@
      # 其他如MinIO、AI服务等可按需添加
      - MINIO_ENDPOINT=#{MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=#{MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=#{MINIO_SECRET_KEY}
      # MongoDB配置
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USERNAME=minglg
      - MONGODB_PASSWORD=kfzx-minglg@
      # 阿里云配置
      - ALIYUN_API_KEY=#{ALIYUN_API_KEY}
    restart: unless-stopped
