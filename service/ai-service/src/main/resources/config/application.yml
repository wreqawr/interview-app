server:
  port: 50000

spring:
  application:
    name: ai-service
  banner:
    location: classpath:banner/banner.txt

  # nacos配置中心
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        namespace: interview
        group: dev
      config:
        namespace: ${spring.cloud.nacos.discovery.namespace}
        group: ${spring.cloud.nacos.discovery.group}
  config:
    import:
      - nacos:nacos-${spring.application.name}.yml?refreshEnabled=true
      - nacos:nacos-redis.yml?refreshEnabled=true
interview:
  ai:
    agent:
      enable: true
      access:
        key-id: ${AccessKeyID}
        key-secret: ${AccessKeySecret}
      live-mic:
        app-id: 5ac096e7-c300-49b0-b465-97e3e7174968
        app-key: ed70235da37f3f555d35436b50b1f74b

  webmvc:
    security:
      white-list-patterns:
        - /api/ai/agent/**