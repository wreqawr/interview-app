server:
  port: 10000

# actuator观测指标
management:
  endpoints:
    web:
      discovery:
        enabled: true
      exposure:
        include: '*'

spring:
  application:
    name: user-service
  banner:
    location: classpath:banner/banner.txt

  # nacos配置中心
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        namespace: interview
        group: dev
      config:
        namespace: ${spring.cloud.nacos.discovery.namespace}
        group: ${spring.cloud.nacos.discovery.group}
#    sentinel:
#      transport:
#        port: 8719
#        dashboard: localhost:8858
  config:
    import:
      - nacos:nacos-${spring.application.name}.yml?refreshEnabled=true
      - nacos:nacos-mysql.yml?refreshEnabled=true
      - nacos:nacos-redis.yml?refreshEnabled=true
#      - nacos:nacos-sentinel.yml?refreshEnabled=true